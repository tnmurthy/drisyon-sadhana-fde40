name: Drisyon Sadhana CI Gate - Forward Deployed Engineer
on: [push, pull_request]

jobs:
  gate-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Gate 1 Verification Tests
        run: pytest tests/test_gate1.py -v
